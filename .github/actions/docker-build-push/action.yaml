name: "Docker Build and Push"
description: "Action to build and push multi-arch docker images"

inputs:
  SHOULD_PUSH:
    description: "Should image be pushed"
    required: true
  IMAGE_NAME:
    description: "Tag of the image being built"
    required: true
  DOCKER_FILE_PATH:
    description: "Path to the Dockerfile"
    required: true
  PLATFORMS:
    description: "Comma-separated list of platforms to build for"
    required: false
    default: "linux/amd64,linux/arm64"

runs:
  using: "composite"
  steps:
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd

    - name: Set up QEMU
      uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
      with:
        images: ${{ steps.login-ecr.outputs.registry }}/${{ inputs.IMAGE_NAME }}
        tags: |
          type=sha,format=short

    - name: Docker build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      with:
        context: ${{ inputs.DOCKER_FILE_PATH }}
        platforms: ${{ inputs.PLATFORMS }}
        push: ${{ inputs.SHOULD_PUSH == 'true' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max