name: "Terraform Plan and Deploy"
description: "Action to plan and apply terraform"

inputs:
  AWS_ACCESS_KEY_ID:
    description: "Access key for AWS account"
    required: true
  AWS_SECRET_ACCESS_KEY:
    description: "Secret Access key for AWS account"
    required: true

runs:
  using: "composite"
  steps:
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
      with:
        terraform_version: 1.16.3
        terraform_wrapper: false

    - name: Setup Terragrunt
      uses: autero1/action-terragrunt@aefb0a43c4f5503a91fefb307745c4d51c26ed0e
      with:
        terragrunt-version: 1.1.5

    - name: Terragrunt Init
      shell: bash
      run: terragrunt run --all init --non-interactive

    - name: Terragrunt Plan
      shell: bash
      env:
        TF_VAR_aws_access_key: ${{ inputs.AWS_ACCESS_KEY_ID }}
        TF_VAR_aws_secret_key: ${{ inputs.AWS_SECRET_ACCESS_KEY }}
        id: plan
      run: terragrunt run --all plan --non-interactive

    - name: Terragrunt Apply
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      shell: bash
      env:
        TF_VAR_aws_access_key: ${{ inputs.AWS_ACCESS_KEY_ID }}
        TF_VAR_aws_secret_key: ${{ inputs.AWS_SECRET_ACCESS_KEY }}
      run: terragrunt run --all apply --non-interactive -- -auto-approve
