name: "Terragrunt Destroy"
description: "Destroy the environment while preserving the ECR repository"

inputs:
  AWS_ACCESS_KEY_ID:
    description: "Access key for AWS account"
    required: true
  AWS_SECRET_ACCESS_KEY:
    description: "Secret access key for AWS account"
    required: true
  TARGET:
    description: "Optional Terraform resource or module address"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
      with:
        terraform_version: 1.16.3
        terraform_wrapper: false

    - name: Setup Terragrunt
      uses: autero1/action-terragrunt@aefb0a43c4f5503a91fefb307745c4d51c26ed0e
      with:
        terragrunt-version: 1.1.5

    - name: Terragrunt Init
      shell: bash
      env:
        TF_VAR_aws_access_key: ${{ inputs.AWS_ACCESS_KEY_ID }}
        TF_VAR_aws_secret_key: ${{ inputs.AWS_SECRET_ACCESS_KEY }}
      run: terragrunt run --all init --non-interactive

    - name: Terragrunt Destroy
      shell: bash
      env:
        TF_VAR_aws_access_key: ${{ inputs.AWS_ACCESS_KEY_ID }}
        TF_VAR_aws_secret_key: ${{ inputs.AWS_SECRET_ACCESS_KEY }}
        TARGET: ${{ inputs.TARGET }}
      run: |
        set -euo pipefail

        if [[ -n "$TARGET" ]]; then
          terragrunt run --all destroy --non-interactive -- -auto-approve -target="$TARGET"
          exit 0
        fi

        terragrunt run --all destroy --non-interactive -- -auto-approve \
          -target=aws_cloudwatch_log_group.ecs \
          -target=aws_iam_role.ecs_instance \
          -target=aws_iam_role_policy_attachment.ecs_instance_ecs \
          -target=aws_iam_role_policy_attachment.ecs_instance_ssm \
          -target=aws_iam_instance_profile.ecs_instance \
          -target=module.ecs_sg \
          -target=module.ec2_capacity_provider \
          -target=module.ecs_cluster \
          -target=module.ecs_task_definition \
          -target=module.ecs_service